# fd-wire-web — prod (fd-prod)
# 柏讯门面脸：官网/控制台静态面（nginx on :8080，非 root，SPA fallback
# 见镜像内 nginx.conf）。对外：NodePort ← cheap-1 SafeLine→Caddy→tailscale
# （wire.finddatatech.cloud，wanxing-web 同法）；/mcp 由 Caddy 直接反代
# registry，不经本 Service（见 ingress.yaml 头注）。
# 镜像 tag 待首次 GHA 构建后回填（TODO(go-live)）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fd-wire-web
  namespace: fd-prod
  labels:
    app.kubernetes.io/name: fd-wire-web
    app.kubernetes.io/part-of: finddata
    app.kubernetes.io/environment: production
spec:
  replicas: 1  # fd-prod compute-quota cpu limits 已满（7900m/8）：v1 单副本轻档，扩容前先调配额
  selector:
    matchLabels:
      app.kubernetes.io/name: fd-wire-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fd-wire-web
        app.kubernetes.io/part-of: finddata
        app.kubernetes.io/environment: production
    spec:
      containers:
        - name: web
          # TODO(go-live): 首次构建后回填实际 sha- tag。
          # 出片 tag=testaction002 build-pool 快照 sha=f07ed95（真 ef98203：图文信息流面板 list；含橱窗/浮层/动作闸既有面）。
          image: ccr.ccs.tencentyun.com/fd-wire/web:sha-f07ed95
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 2
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { cpu: 100m, memory: 128Mi }
          env:
            # admin 第二道闸的服务端注入源（wire-self-serve-launch 5.2 附带）：
            # nginx envsubst 模板把它渲染进 /internal/ 反代的
            # proxy_set_header X-Admin-Token——值只存在容器 env，永不下发浏览器。
            # 复用既有 fd-wire-env Secret 键（与 fd-wire-api 同源，轮换同步滚动）。
            - name: FD_WIRE_ADMIN_TOKEN
              valueFrom:
                secretKeyRef: { name: fd-wire-env, key: fd_wire_admin_token }
---
apiVersion: v1
kind: Service
metadata:
  name: fd-wire-web
  namespace: fd-prod
  labels:
    app.kubernetes.io/name: fd-wire-web
    app.kubernetes.io/part-of: finddata
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: fd-wire-web
  ports:
    - name: http
      port: 80
      targetPort: http
      # TODO(go-live): 台账先行——先在 fd-infra-deploy PORTS.md 登记再定值。
      # 31882 系当前空档推定（wanxing-web 已占 31880），主代理核对台账后
      # 如有冲突改此处并同步 PORTS.md（冻结端口见台账第 2 节）。
      nodePort: 31882
