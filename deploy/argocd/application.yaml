# ArgoCD Application — fd-wire（cheap 集群 fd-prod）。
# fd-infra-deploy argocd/ 同法：Application 放在同步路径（deploy/k8s）之外，
# 避免自引用；GitOps 只管工作负载清单。清单不含明文 Secret——fd-wire-env
# 在集群内手工创建且不入 git（deploy/README.md 步骤 6；sub2api 同纪律）。
# 注意顺序：README 步骤 4-5（首次构建 + 回填 sha- tag）完成后再创建本 app，
# 否则首同步以占位 tag 起容器即 ImagePullBackOff。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fd-wire
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://gitee.com/FindDataTechnology/fd-wire.git
    targetRevision: main
    path: deploy/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: fd-prod
  syncPolicy:
    # 全新服务（非 sub2api 那种收编在跑对象），直接 selfHeal。
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
