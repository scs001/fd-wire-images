# fd-wire-web main config — runs as non-root (image USER nginx).
# envsubst 渲染管道说明（wire-self-serve-launch 5.2 附带）：server 块
# （nginx.conf，挂为 conf.d/default.conf）是 envsubst 模板，容器启动时
# 以白名单 '$FD_WIRE_ADMIN_TOKEN' 渲染后落 conf.d/default.conf；本主配置
# 无任何 ${VAR} 面（pid/events/http 静态指令），保持静态 COPY、不经渲染——
# nginx 运行时变量（$host/$uri…）因此天然不受 envsubst 影响。
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    include /etc/nginx/conf.d/*.conf;
}
