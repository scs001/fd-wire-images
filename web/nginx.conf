# fd-wire-web server 块（挂为 conf.d/default.conf）。
# 本文件是 envsubst 模板：容器启动时由 CMD 渲染到 /etc/nginx/conf.d/default.conf，
# 白名单只替换 ${FD_WIRE_ADMIN_TOKEN}——nginx 运行时变量（$host/$uri…）原样保留。
# 8080 = 非特权端口（镜像 USER nginx）；k8s Service targetPort http → 8080。
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由：hash-routed React 壳（App.tsx），/ 与 /console 深链一律
    # 回落 index.html 由前端路由接管（任务 3.4 契约）；/console/callback 为
    # Logto 授权码回调真实路径（wire-self-serve-launch 4.4），同样回落壳页。
    # index.html 必须 no-cache：HTML 引用指纹资产（/assets/immutable），发版
    # 只换 HTML——缺该头时浏览器按启发式缓存把旧 HTML 当新鲜直用，新版本
    # 长时间不生效（2026-10-12 wire-form-field-linkage 上产实证，同官网
    # EdgeOne 课）。no-cache=每次回源校验（ETag 304 命中仍零传输）。
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
    # 显式重复一条仅为自文档——与 / 同效。
    # `^~`：下面那条按扩展名的正则优先级**高于普通前缀 location**，不加这个标记
    # `/console/a.b` 这类带点的 SPA 深链会被正则抓走变 404。这条必须赢。
    location ^~ /console {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Vite 指纹产物在 /assets/，内容寻址可长缓存。
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 按**扩展名**兜一层：任何 .js/.css/图片/字体的未命中一律 404。
    # 为什么前缀那两条不够：它们只管 `/assets/` 与 `/public/` 两个目录，
    # 而宿主/注入器要的脚本在**根**（`/copilot.js`）。2026-11-13 线上实测
    # `wire.finddatatech.cloud/copilot.js → 200 text/html 417B`——正是 index.html
    # 的体积指纹（同一天已修过 `/assets/`、`/public/` 两个面，却漏了这条最要紧的）。
    # 扩展名里**刻意不含 json/txt**：`/internal/` 是反代端点族，带这些后缀的路径
    # 属于上游而不是静态面；少一个后缀就少一类"代理被静态规则抢走"的风险。
    location ~* \.(?:js|mjs|css|map|png|jpe?g|gif|svg|webp|ico|woff2?|ttf|eot)$ {
        try_files $uri =404;
        access_log off;
    }

    # 静态旁路目录：/public/ 下**只有真实存在的文件**该被返回，其余一律 404。
    # 没有这条时未命中路径落进 `location /` 的 SPA 回落，拿到 200 的 index.html——
    # `<script src=...>` 收到 HTML 会解析失败并**静默死**，现场症状是"脚本没跑"，
    # 而状态码、Content-Length 都正常。2026-11-13 实测本服务：
    # `/public/copilot.js → 200 text/html`（该路径在 wire 线本就未绑定副驾注入，
    # 正确结果是 404）；同族见上一条 `/assets/`——两者当初是同一个缺陷的两个面。
    location /public/ {
        try_files $uri =404;
    }

    # ── /internal/：内部后台端点族直反代 api 后端（同域打通）──────────
    # proxy_pass 不带 URI 后缀 → 原始路径原样透传（保 /internal/admin
    # 前缀；带 / 结尾会 strip 前缀致 404）。
    # admin 双闸（wire-self-serve-launch 5.2）：第一道闸 = 请求自带
    # Authorization: Bearer <ID token>（照常透传，服务端校验 wire-admin 角色）；
    # 第二道闸 = X-Admin-Token 由本容器在服务端注入（env FD_WIRE_ADMIN_TOKEN，
    # 渲染进 nginx 配置）——值永不下发浏览器。未设置该 env 时注入空值，
    # 后端 fail-closed 403。/api 仍由边缘 Caddy 承接，此处刻意不设 /api 反代。
    # `^~`：同上——这条是反代，绝不能被上面按扩展名的正则抓成静态 404。
    # 上游路径里带 `.js`/`.css` 的可能性不高，但"代理被静态规则抢走"属于那种
    # 只在某个特定 URL 上才复现、且看起来像后端挂了的问题，不值得赌。
    location ^~ /internal/ {
        # 上游走**变量形式**的 proxy_pass：nginx 启动时不去解析主机名（只在首个
        # 请求时按 resolver 解析）。这让镜像在解析不到集群 DNS 的环境（构建池 smoke）
        # 也能正常起容器——启动期解析失败正是此前 smoke 报
        # "host not found in upstream" 的原因。
        # 集群内可通过 FD_WIRE_API_UPSTREAM 覆盖（默认下面这个 Service 全名）。
        # resolver 用 IP 而非集群 DNS 名——resolver 指令自身也在启动期解析，
        # 写集群 DNS 名会让 smoke 环境同样起不来。这两个是集群 CoreDNS 的
        # Service ClusterIP，同时兼作公网转发；池环境里它们只影响 /internal/ 的解析。
        resolver 10.43.0.10 valid=10s ipv6=off;
        set $wire_api_upstream "${FD_WIRE_API_UPSTREAM}";
        proxy_pass http://$wire_api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Admin-Token "${FD_WIRE_ADMIN_TOKEN}";
        # 萬星直连是同步长调用（真实生成单回执实测 ~109s，A2A_TIMEOUT 300s
        # 上限）：nginx 默认 proxy_read_timeout 60s 会在回执前掐断连接，
        # 浏览器只拿到网关错误、看不到服务端口径（服务端仍跑完并如实留档
        # wanxing_dispatch_failed）。读超时须 ≥ 后端 A2A 超时，留 20s 余量。
        # 2026-10-13 wire-wanxing-direct-dispatch 生产实弹抓出。
        proxy_read_timeout 320s;
        proxy_send_timeout 320s;
    }

    # ── /mcp：本容器不服务，也永远不该收到该流量 ──────────────────────
    # wire.finddatatech.cloud/mcp 由边缘 Caddy（the node）直接反代 registry
    # 的 wire 入口（鉴权/逐调用审计在 registry 侧完成）；实际反代在 Caddy
    # 层做，这里只留说明，不设 location。

    # ── 未来：控制台服务端接口走同域 /api/ 反代（占位注释） ────────────
    # 控制台接上后端视图时启用（wanxing-web 同域反代同法）：
    # location /api/ {
    #     proxy_pass http://fd-wire-api.fd-prod.svc.cluster.local:8000/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # }
}
