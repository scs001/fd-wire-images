# fd-wire-web server 块（挂为 conf.d/default.conf）。
# 本文件是 envsubst 模板：容器启动时由 CMD 渲染到 /etc/nginx/conf.d/default.conf，
# 白名单只替换 ${FD_WIRE_ADMIN_TOKEN}——nginx 运行时变量（$host/$uri…）原样保留。
# 8080 = 非特权端口（镜像 USER nginx）；k8s Service targetPort http → 8080。
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由：hash-routed React 壳（App.tsx），/ 与 /console 深链一律
    # 回落 index.html 由前端路由接管（任务 3.4 契约）；/console/callback 为
    # Logto 授权码回调真实路径（wire-self-serve-launch 4.4），同样回落壳页。
    # index.html 必须 no-cache：HTML 引用指纹资产（/assets/immutable），发版
    # 只换 HTML——缺该头时浏览器按启发式缓存把旧 HTML 当新鲜直用，新版本
    # 长时间不生效（2026-10-12 wire-form-field-linkage 上产实证，同官网
    # EdgeOne 课）。no-cache=每次回源校验（ETag 304 命中仍零传输）。
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
    # 显式重复一条仅为自文档——与 / 同效。
    location /console {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Vite 指纹产物在 /assets/，内容寻址可长缓存。
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ── /internal/：内部后台端点族直反代 api 后端（同域打通）──────────
    # proxy_pass 不带 URI 后缀 → 原始路径原样透传（保 /internal/admin
    # 前缀；带 / 结尾会 strip 前缀致 404）。
    # admin 双闸（wire-self-serve-launch 5.2）：第一道闸 = 请求自带
    # Authorization: Bearer <ID token>（照常透传，服务端校验 wire-admin 角色）；
    # 第二道闸 = X-Admin-Token 由本容器在服务端注入（env FD_WIRE_ADMIN_TOKEN，
    # 渲染进 nginx 配置）——值永不下发浏览器。未设置该 env 时注入空值，
    # 后端 fail-closed 403。/api 仍由边缘 Caddy 承接，此处刻意不设 /api 反代。
    location /internal/ {
        proxy_pass http://fd-wire-api.fd-prod.svc.cluster.local:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Admin-Token $FD_WIRE_ADMIN_TOKEN;
        # 萬星直连是同步长调用（真实生成单回执实测 ~109s，A2A_TIMEOUT 300s
        # 上限）：nginx 默认 proxy_read_timeout 60s 会在回执前掐断连接，
        # 浏览器只拿到网关错误、看不到服务端口径（服务端仍跑完并如实留档
        # wanxing_dispatch_failed）。读超时须 ≥ 后端 A2A 超时，留 20s 余量。
        # 2026-10-13 wire-wanxing-direct-dispatch 生产实弹抓出。
        proxy_read_timeout 320s;
        proxy_send_timeout 320s;
    }

    # ── /mcp：本容器不服务，也永远不该收到该流量 ──────────────────────
    # wire.finddatatech.cloud/mcp 由边缘 Caddy（cheap-1）直接反代 registry
    # 的 wire 入口（鉴权/逐调用审计在 registry 侧完成）；实际反代在 Caddy
    # 层做，这里只留说明，不设 location。

    # ── 未来：控制台服务端接口走同域 /api/ 反代（占位注释） ────────────
    # 控制台接上后端视图时启用（wanxing-web 同域反代同法）：
    # location /api/ {
    #     proxy_pass http://fd-wire-api.fd-prod.svc.cluster.local:8000/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # }
}
